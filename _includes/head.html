{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Apply the saved preference before loading styles; new visitors start in dark mode.
  try {
    var savedTheme = localStorage.getItem("theme");
    var useLightTheme = savedTheme === "light" ||
      (savedTheme === "system" && !window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (useLightTheme) {
      document.documentElement.removeAttribute("data-theme");
    }
  } catch (error) {
    // Keep the default dark theme when browser storage is unavailable.
  }
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
